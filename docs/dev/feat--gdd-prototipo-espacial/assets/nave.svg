<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="titulo-nave">
  <title id="titulo-nave">Nave del jugador con escudo energético y dron de apoyo</title>
  <defs>
    <radialGradient id="halo-escudo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="88%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="chasis-nave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#11182B"/>
    </linearGradient>
    <linearGradient id="llama-motor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="45%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="resplandor-cian" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo espacial -->
  <rect width="256" height="256" fill="#080C18"/>
  <g stroke="#263554" stroke-width="0.75" opacity="0.28">
    <line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="192" y1="0" x2="192" y2="256"/>
    <line x1="0" y1="64" x2="256" y2="64"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="192" x2="256" y2="192"/>
  </g>
  <g fill="#94A3B8">
    <circle cx="26" cy="34" r="1.1" opacity="0.6"/>
    <circle cx="222" cy="30" r="1.4" opacity="0.7"/>
    <circle cx="42" cy="212" r="1.2" opacity="0.5"/>
    <circle cx="218" cy="204" r="1" opacity="0.6"/>
    <circle cx="158" cy="24" r="0.9" opacity="0.5"/>
    <circle cx="18" cy="126" r="1.2" opacity="0.45"/>
    <circle cx="236" cy="144" r="1.1" opacity="0.55"/>
  </g>

  <!-- Órbita del dron de apoyo -->
  <circle cx="116" cy="140" r="96" fill="none" stroke="#263554" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.8"/>

  <!-- Escudo energético sutil de la nave -->
  <circle cx="116" cy="140" r="64" fill="url(#halo-escudo)"/>
  <circle cx="116" cy="140" r="64" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-opacity="0.7" filter="url(#resplandor-cian)"/>
  <circle cx="116" cy="140" r="59" fill="none" stroke="#22D3EE" stroke-width="0.9" stroke-dasharray="14 8 4 8" stroke-opacity="0.55"/>

  <!-- Proyectiles aliados -->
  <g filter="url(#resplandor-cian)">
    <rect x="114.5" y="28" width="3" height="22" rx="1.5" fill="#38BDF8"/>
    <rect x="115.2" y="30" width="1.6" height="14" rx="0.8" fill="#F1F5F9"/>
    <rect x="194.8" y="34" width="2.4" height="16" rx="1.2" fill="#22D3EE"/>
  </g>

  <!-- Propulsores de la nave -->
  <g filter="url(#resplandor-cian)">
    <polygon points="99,174 107,174 103,204" fill="url(#llama-motor)"/>
    <polygon points="125,174 133,174 129,204" fill="url(#llama-motor)"/>
    <polygon points="111,178 121,178 116,210" fill="url(#llama-motor)"/>
  </g>

  <!-- Silueta principal de la nave del jugador -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Alas exteriores -->
    <polygon points="116,86 70,158 84,166 100,148 132,148 148,166 162,158" fill="url(#chasis-nave)" stroke="#38BDF8" stroke-width="2"/>
    <!-- Cañones laterales -->
    <line x1="86" y1="126" x2="86" y2="152" stroke="#38BDF8" stroke-width="2.5"/>
    <line x1="146" y1="126" x2="146" y2="152" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="86" cy="124" r="2" fill="#22D3EE"/>
    <circle cx="146" cy="124" r="2" fill="#22D3EE"/>
    <!-- Fuselaje central -->
    <polygon points="116,74 102,126 98,174 134,174 130,126" fill="#11182B" stroke="#38BDF8" stroke-width="2.2"/>
    <!-- Líneas técnicas internas -->
    <polyline points="103,144 116,136 129,144" fill="none" stroke="#263554" stroke-width="1.5"/>
    <line x1="116" y1="76" x2="116" y2="172" stroke="#263554" stroke-width="1.2"/>
    <!-- Cabina -->
    <polygon points="116,96 110,120 116,128 122,120" fill="#22D3EE" fill-opacity="0.85" stroke="#F1F5F9" stroke-width="1"/>
    <!-- Toberas -->
    <rect x="99" y="170" width="8" height="5" rx="1" fill="#263554" stroke="#38BDF8" stroke-width="1"/>
    <rect x="125" y="170" width="8" height="5" rx="1" fill="#263554" stroke="#38BDF8" stroke-width="1"/>
  </g>

  <!-- Dron de apoyo orbitando en paralelo -->
  <g transform="translate(196, 80)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
    <polygon points="0,-16 14,0 8,14 -8,14 -14,0" fill="#11182B" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
    <line x1="-14" y1="0" x2="-20" y2="6" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="0" x2="20" y2="6" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-2" r="4.5" fill="#22D3EE" filter="url(#resplandor-cian)"/>
    <circle cx="0" cy="-2" r="2" fill="#F1F5F9"/>
    <polygon points="-3,14 3,14 0,23" fill="url(#llama-motor)"/>
  </g>

  <!-- Leyenda táctica inferior -->
  <rect x="14" y="222" width="228" height="22" rx="4" fill="#11182B" stroke="#263554" stroke-width="1"/>
  <circle cx="28" cy="233" r="4" fill="#38BDF8"/>
  <text x="38" y="237" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600">Nave y dron</text>
  <circle cx="128" cy="233" r="4" fill="#22D3EE"/>
  <text x="138" y="237" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5">Escudo activo</text>
</svg>
