<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="titulo-jefe">
  <title id="titulo-jefe">Jefe de planeta segmentado con torretas y barra de vida</title>
  <defs>
    <radialGradient id="nucleo-jefe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="75%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="resplandor-jefe" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo espacial -->
  <rect width="320" height="320" fill="#080C18"/>
  <g stroke="#263554" stroke-width="0.75" opacity="0.28">
    <line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="160" x2="320" y2="160"/>
    <line x1="0" y1="240" x2="320" y2="240"/>
  </g>
  <g fill="#94A3B8">
    <circle cx="30" cy="84" r="1.2" opacity="0.6"/>
    <circle cx="288" cy="96" r="1.3" opacity="0.65"/>
    <circle cx="42" cy="272" r="1.1" opacity="0.5"/>
    <circle cx="276" cy="264" r="1.2" opacity="0.55"/>
  </g>

  <!-- Barra de vida de muestra superior -->
  <rect x="20" y="14" width="280" height="44" rx="6" fill="#11182B" stroke="#263554" stroke-width="1.2"/>
  <text x="30" y="31" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700">JEFE · GUARDIÁN SOLAR</text>
  <text x="290" y="31" text-anchor="end" fill="#94A3B8" font-family="ui-monospace, 'Cascadia Mono', monospace" font-size="10.5">21.000 / 30.000 PV</text>
  <rect x="30" y="39" width="260" height="10" rx="3" fill="#080C18" stroke="#263554" stroke-width="1"/>
  <rect x="31" y="40" width="182" height="8" rx="2.5" fill="#EF4444"/>
  <rect x="209" y="40" width="4" height="8" rx="1" fill="#FBBF24"/>

  <!-- Propulsores traseros del jefe -->
  <g filter="url(#resplandor-jefe)">
    <rect x="116" y="72" width="16" height="14" rx="3" fill="#EF4444" opacity="0.8"/>
    <rect x="188" y="72" width="16" height="14" rx="3" fill="#EF4444" opacity="0.8"/>
    <rect x="150" y="68" width="20" height="18" rx="4" fill="#FBBF24" opacity="0.75"/>
  </g>

  <!-- Estructura principal segmentada del jefe -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Alas pesadas laterales -->
    <polygon points="88,118 32,150 26,204 68,236 106,208 106,134" fill="#11182B" stroke="#EF4444" stroke-width="2.2"/>
    <polygon points="232,118 288,150 294,204 252,236 214,208 214,134" fill="#11182B" stroke="#EF4444" stroke-width="2.2"/>

    <!-- Blindaje interior de alas -->
    <polygon points="84,136 46,158 42,196 72,218 96,198" fill="#1A1220" stroke="#263554" stroke-width="1.3"/>
    <polygon points="236,136 274,158 278,196 248,218 224,198" fill="#1A1220" stroke="#263554" stroke-width="1.3"/>

    <!-- Casco central segmentado -->
    <polygon points="160,84 214,116 222,198 188,266 160,280 132,266 98,198 106,116" fill="#11182B" stroke="#EF4444" stroke-width="2.6"/>
    <!-- Costillas y divisiones de segmento -->
    <polyline points="108,144 160,124 212,144" fill="none" stroke="#263554" stroke-width="1.6"/>
    <polyline points="102,194 160,218 218,194" fill="none" stroke="#263554" stroke-width="1.6"/>
    <line x1="160" y1="86" x2="160" y2="146" stroke="#EF4444" stroke-width="1.4" opacity="0.6"/>
    <line x1="160" y1="208" x2="160" y2="276" stroke="#EF4444" stroke-width="1.4" opacity="0.6"/>

    <!-- Escudos frontales -->
    <polygon points="134,240 160,272 186,240 160,252" fill="#1A1220" stroke="#EF4444" stroke-width="1.6"/>
  </g>

  <!-- 4 torretas simétricas -->
  <!-- Torreta superior izquierda -->
  <g transform="translate(64, 174)">
    <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#11182B" stroke="#EF4444" stroke-width="1.8"/>
    <line x1="-5" y1="12" x2="-5" y2="30" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="12" x2="5" y2="30" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#FB7185"/>
    <circle cx="-5" cy="31" r="2.2" fill="#FBBF24" filter="url(#resplandor-jefe)"/>
    <circle cx="5" cy="31" r="2.2" fill="#FBBF24" filter="url(#resplandor-jefe)"/>
  </g>
  <!-- Torreta superior derecha -->
  <g transform="translate(256, 174)">
    <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#11182B" stroke="#EF4444" stroke-width="1.8"/>
    <line x1="-5" y1="12" x2="-5" y2="30" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="5" y1="12" x2="5" y2="30" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#FB7185"/>
    <circle cx="-5" cy="31" r="2.2" fill="#FBBF24" filter="url(#resplandor-jefe)"/>
    <circle cx="5" cy="31" r="2.2" fill="#FBBF24" filter="url(#resplandor-jefe)"/>
  </g>
  <!-- Torreta frontal izquierda -->
  <g transform="translate(122, 224)">
    <circle cx="0" cy="0" r="11" fill="#11182B" stroke="#EF4444" stroke-width="1.8"/>
    <line x1="-3.5" y1="10" x2="-3.5" y2="24" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="3.5" y1="10" x2="3.5" y2="24" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#FBBF24"/>
  </g>
  <!-- Torreta frontal derecha -->
  <g transform="translate(198, 224)">
    <circle cx="0" cy="0" r="11" fill="#11182B" stroke="#EF4444" stroke-width="1.8"/>
    <line x1="-3.5" y1="10" x2="-3.5" y2="24" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="3.5" y1="10" x2="3.5" y2="24" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#FBBF24"/>
  </g>

  <!-- Núcleo central de energía -->
  <g filter="url(#resplandor-jefe)">
    <circle cx="160" cy="174" r="30" fill="url(#nucleo-jefe)"/>
    <circle cx="160" cy="174" r="22" fill="none" stroke="#EF4444" stroke-width="2"/>
    <polygon points="160,154 176,174 160,194 144,174" fill="#EF4444" stroke="#FBBF24" stroke-width="1.5"/>
    <circle cx="160" cy="174" r="7" fill="#F1F5F9"/>
  </g>

  <!-- Leyenda táctica inferior -->
  <rect x="20" y="288" width="280" height="22" rx="4" fill="#11182B" stroke="#263554" stroke-width="1"/>
  <circle cx="34" cy="299" r="4" fill="#EF4444"/>
  <text x="44" y="303" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600">Jefe de planeta</text>
  <circle cx="152" cy="299" r="4" fill="#FBBF24"/>
  <text x="162" y="303" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5">4 torretas y núcleo</text>
</svg>
