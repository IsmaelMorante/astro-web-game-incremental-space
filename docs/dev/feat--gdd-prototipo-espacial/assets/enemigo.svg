<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="titulo-enemigo">
  <title id="titulo-enemigo">Interceptor enemigo hostil con núcleo brillante</title>
  <defs>
    <radialGradient id="nucleo-hostil" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </radialGradient>
    <linearGradient id="haz-hostil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </linearGradient>
    <filter id="resplandor-hostil" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo espacial -->
  <rect width="256" height="256" fill="#080C18"/>
  <g stroke="#263554" stroke-width="0.75" opacity="0.28">
    <line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="192" y1="0" x2="192" y2="256"/>
    <line x1="0" y1="64" x2="256" y2="64"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="192" x2="256" y2="192"/>
  </g>
  <g fill="#94A3B8">
    <circle cx="28" cy="40" r="1.2" opacity="0.6"/>
    <circle cx="222" cy="36" r="1.1" opacity="0.65"/>
    <circle cx="38" cy="184" r="1" opacity="0.5"/>
    <circle cx="224" cy="190" r="1.2" opacity="0.6"/>
  </g>

  <!-- Esquinas tácticas de amenaza -->
  <g stroke="#FB7185" stroke-width="1.4" opacity="0.45" fill="none">
    <polyline points="52,66 52,52 66,52"/>
    <polyline points="190,52 204,52 204,66"/>
    <polyline points="52,174 52,188 66,188"/>
    <polyline points="190,188 204,188 204,174"/>
  </g>

  <!-- Disparo hostil -->
  <g filter="url(#resplandor-hostil)">
    <rect x="125.5" y="170" width="5" height="34" rx="2.5" fill="url(#haz-hostil)"/>
    <circle cx="128" cy="186" r="3" fill="#FBBF24"/>
  </g>

  <!-- Silueta angular agresiva del caza enemigo (apuntando hacia abajo) -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Pinzas frontales exteriores -->
    <polygon points="88,78 58,128 72,166 94,132" fill="#11182B" stroke="#FB7185" stroke-width="2"/>
    <polygon points="168,78 198,128 184,166 162,132" fill="#11182B" stroke="#FB7185" stroke-width="2"/>
    <!-- Aletas traseras -->
    <polygon points="94,68 112,86 102,114 82,92" fill="#1A1222" stroke="#FB7185" stroke-width="1.8"/>
    <polygon points="162,68 144,86 154,114 174,92" fill="#1A1222" stroke="#FB7185" stroke-width="1.8"/>
    <!-- Casco central agresivo -->
    <polygon points="128,58 156,102 146,154 128,172 110,154 100,102" fill="#11182B" stroke="#FB7185" stroke-width="2.4"/>
    <!-- Líneas internas de blindaje -->
    <polyline points="106,106 128,122 150,106" fill="none" stroke="#FB7185" stroke-width="1.3" opacity="0.65"/>
    <line x1="128" y1="60" x2="128" y2="96" stroke="#263554" stroke-width="1.5"/>
    <line x1="128" y1="138" x2="128" y2="170" stroke="#FB7185" stroke-width="1.5"/>
  </g>

  <!-- Núcleo rojo / ámbar -->
  <g filter="url(#resplandor-hostil)">
    <polygon points="128,100 140,116 128,134 116,116" fill="url(#nucleo-hostil)" stroke="#F1F5F9" stroke-width="0.9"/>
    <circle cx="128" cy="116" r="4" fill="#F1F5F9"/>
  </g>

  <!-- Leyenda táctica inferior -->
  <rect x="14" y="222" width="228" height="22" rx="4" fill="#11182B" stroke="#263554" stroke-width="1"/>
  <circle cx="28" cy="233" r="4" fill="#FB7185"/>
  <text x="38" y="237" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600">Enemigo hostil</text>
  <circle cx="140" cy="233" r="4" fill="#FBBF24"/>
  <text x="150" y="237" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5">Núcleo activo</text>
</svg>
