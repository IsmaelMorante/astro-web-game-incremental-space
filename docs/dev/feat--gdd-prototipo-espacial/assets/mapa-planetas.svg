<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-labelledby="titulo-mapa">
  <title id="titulo-mapa">Ruta lineal de los 4 planetas con dificultad, jefe y estado</title>
  <defs>
    <filter id="resplandor-ruta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="280" fill="#080C18"/>
  <rect x="10" y="10" width="780" height="260" rx="10" fill="none" stroke="#263554" stroke-width="1.2"/>
  <g fill="#94A3B8">
    <circle cx="46" cy="48" r="1.1" opacity="0.5"/>
    <circle cx="212" cy="36" r="1" opacity="0.45"/>
    <circle cx="404" cy="52" r="1.2" opacity="0.55"/>
    <circle cx="624" cy="38" r="1" opacity="0.5"/>
    <circle cx="754" cy="64" r="1.2" opacity="0.5"/>
  </g>

  <!-- Cabecera -->
  <text x="28" y="38" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Mapa estelar · Progresión lineal de 4 planetas</text>
  <text x="772" y="38" text-anchor="end" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5">Desbloqueo progresivo tras derrotar al jefe de cada planeta</text>

  <!-- Líneas de ruta entre planetas (centros x = 112, 304, 496, 688; y = 104) -->
  <!-- Planeta 1 -> Planeta 2 (completado/desbloqueado) -->
  <line x1="142" y1="104" x2="274" y2="104" stroke="#10B981" stroke-width="3"/>
  <polygon points="270,99 279,104 270,109" fill="#10B981"/>

  <!-- Planeta 2 -> Planeta 3 (bloqueado pendiente de jefe 2) -->
  <line x1="334" y1="104" x2="466" y2="104" stroke="#263554" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polygon points="462,99 471,104 462,109" fill="#263554"/>

  <!-- Planeta 3 -> Planeta 4 (bloqueado) -->
  <line x1="526" y1="104" x2="658" y2="104" stroke="#263554" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polygon points="654,99 663,104 654,109" fill="#263554"/>

  <!-- PLANETA 1: Cinturón de Hierro (Desbloqueado) -->
  <g transform="translate(112, 104)">
    <circle cx="0" cy="0" r="30" fill="#11182B" stroke="#10B981" stroke-width="2.4"/>
    <circle cx="0" cy="0" r="20" fill="#5C4B37" stroke="#A88B68" stroke-width="1.5"/>
    <path d="M -12,-6 L -2,-2 L 8,-10 M -6,10 L 6,4 L 14,9" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x="22" y="148" width="180" height="106" rx="8" fill="#11182B" stroke="#10B981" stroke-width="1.4"/>
  <rect x="30" y="156" width="84" height="18" rx="4" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="1"/>
  <text x="72" y="168.5" text-anchor="middle" fill="#10B981" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700">DESBLOQUEADO</text>
  <text x="30" y="191" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700">1. Cinturón de Hierro</text>
  <text x="30" y="209" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5">Ast: 60 PV · Enem: 110 PV</text>
  <text x="30" y="225" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5">Umbral jefe: 25 objetivos</text>
  <text x="30" y="242" fill="#EF4444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600">Perforadora Titán · 1.200 PV</text>

  <!-- PLANETA 2: Órbita de Cobalto (Actual) -->
  <g transform="translate(304, 104)">
    <circle cx="0" cy="0" r="36" fill="none" stroke="#22D3EE" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#resplandor-ruta)"/>
    <circle cx="0" cy="0" r="30" fill="#11182B" stroke="#38BDF8" stroke-width="2.8" filter="url(#resplandor-ruta)"/>
    <circle cx="0" cy="0" r="20" fill="#162B4D" stroke="#38BDF8" stroke-width="1.6"/>
    <ellipse cx="0" cy="0" rx="26" ry="7" transform="rotate(-18)" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
  </g>
  <rect x="214" y="148" width="180" height="106" rx="8" fill="#11182B" stroke="#38BDF8" stroke-width="1.8"/>
  <rect x="222" y="156" width="58" height="18" rx="4" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
  <text x="251" y="168.5" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700">ACTUAL</text>
  <rect x="286" y="156" width="94" height="18" rx="4" fill="#FBBF24" fill-opacity="0.16" stroke="#FBBF24" stroke-width="1"/>
  <text x="333" y="168.5" text-anchor="middle" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600">Jefe disponible</text>
  <text x="222" y="191" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700">2. Órbita de Cobalto</text>
  <text x="222" y="209" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5">Ast: 220 PV · Enem: 400 PV</text>
  <text x="222" y="225" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5">Umbral jefe: 35 objetivos</text>
  <text x="222" y="242" fill="#EF4444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600">Fragata Cobalto · 4.800 PV</text>

  <!-- PLANETA 3: Nebulosa de Plasma (Bloqueado) -->
  <g transform="translate(496, 104)" opacity="0.72">
    <circle cx="0" cy="0" r="30" fill="#11182B" stroke="#263554" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="20" fill="#2A172D" stroke="#FB7185" stroke-width="1.4"/>
    <path d="M -11,-4 Q 0,-12 12,-2 M -10,7 Q 2,12 11,4" fill="none" stroke="#FB7185" stroke-width="1.5"/>
    <!-- Icono candado -->
    <rect x="-6" y="-2" width="12" height="9" rx="2" fill="#080C18" stroke="#94A3B8" stroke-width="1.3"/>
    <path d="M -3.5,-2 V -5.5 A 3.5,3.5 0 0 1 3.5,-5.5 V -2" fill="none" stroke="#94A3B8" stroke-width="1.3"/>
  </g>
  <rect x="406" y="148" width="180" height="106" rx="8" fill="#11182B" stroke="#263554" stroke-width="1.2"/>
  <rect x="414" y="156" width="74" height="18" rx="4" fill="#263554" fill-opacity="0.45" stroke="#263554" stroke-width="1"/>
  <text x="451" y="168.5" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700">BLOQUEADO</text>
  <text x="414" y="191" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700">3. Nebulosa de Plasma</text>
  <text x="414" y="209" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5">Ast: 650 PV · Enem: 1.150 PV</text>
  <text x="414" y="225" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5">Umbral jefe: 45 objetivos</text>
  <text x="414" y="242" fill="#EF4444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600">Crucero Nebular · 14.500 PV</text>

  <!-- PLANETA 4: Núcleo Estelar (Bloqueado) -->
  <g transform="translate(688, 104)" opacity="0.72">
    <circle cx="0" cy="0" r="30" fill="#11182B" stroke="#263554" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="20" fill="#33161B" stroke="#EF4444" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="11" fill="none" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="3 3"/>
    <!-- Icono candado -->
    <rect x="-6" y="-2" width="12" height="9" rx="2" fill="#080C18" stroke="#94A3B8" stroke-width="1.3"/>
    <path d="M -3.5,-2 V -5.5 A 3.5,3.5 0 0 1 3.5,-5.5 V -2" fill="none" stroke="#94A3B8" stroke-width="1.3"/>
  </g>
  <rect x="598" y="148" width="180" height="106" rx="8" fill="#11182B" stroke="#263554" stroke-width="1.2"/>
  <rect x="606" y="156" width="74" height="18" rx="4" fill="#263554" fill-opacity="0.45" stroke="#263554" stroke-width="1"/>
  <text x="643" y="168.5" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700">BLOQUEADO</text>
  <text x="606" y="191" fill="#F1F5F9" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700">4. Núcleo Estelar</text>
  <text x="606" y="209" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5">Ast: 1.600 PV · Enem: 2.800 PV</text>
  <text x="606" y="225" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5">Umbral jefe: 50 objetivos</text>
  <text x="606" y="242" fill="#EF4444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="600">Guardián Solar · 30.000 PV</text>
</svg>
